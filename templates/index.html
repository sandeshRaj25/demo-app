<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello App</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      width: 320px;
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Hello App</h1>

    <input
      type="text"
      id="name"
      placeholder="Enter your name"
    />

    <button onclick="sayHello()">Submit</button>

    <div id="result"></div>
  </div>

  <script>
    async function sayHello() {
      const name = document.getElementById("name").value.trim();

      if (!name) {
        document.getElementById("result").textContent =
          "Please enter your name";
        return;
      }

      const response = await fetch(
        "/hello?name=" + encodeURIComponent(name)
      );

      const data = await response.json();

      document.getElementById("result").textContent =
        data.message;
    }
  </script>
</body>
</html>
